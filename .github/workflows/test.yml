name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: allow

    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      
      - name: Tests
        run: cargo test

      - name: Formating
        run: cargo fmt --check
