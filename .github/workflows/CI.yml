name: CI

on:
  push:
    branches:
      - dont_publish_yet
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test.yml
  
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            rustflags: "-C target-cpu=x86-64-v3"

          - runner: ubuntu-22.04
            target: x86
            rustflags: ""

          - runner: ubuntu-22.04
            target: aarch64
            rustflags: "-C target-cpu=neoverse-n1"

          - runner: ubuntu-22.04
            target: armv7
            rustflags: "-C target-cpu=cortex-a7"

          - runner: ubuntu-22.04
            target: s390x
            rustflags: "-C target-cpu=z15"

          - runner: ubuntu-22.04
            target: ppc64le
            rustflags: "-C target-cpu=power9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
            RUSTFLAGS: ${{ matrix.platform.rustflags }}
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            rustflags: "-C target-cpu=x86-64-v3"

          - runner: ubuntu-22.04
            target: x86
            rustflags: ""

          - runner: ubuntu-22.04
            target: aarch64
            rustflags: "-C target-cpu=neoverse-n1"

          - runner: ubuntu-22.04
            target: armv7
            rustflags: "-C target-cpu=cortex-a7"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
            RUSTFLAGS: ${{ matrix.platform.rustflags }}
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
            rustflags: "-C target-cpu=x86-64-v3"

          - runner: windows-latest
            target: x86
            python_arch: x86
            rustflags: ""

          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            rustflags: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
            RUSTFLAGS: ${{ matrix.platform.rustflags }}
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - runner: macos-15-intel
            target: x86_64
            rustflags: "-C target-cpu=x86-64-v3"

          - runner: macos-latest
            target: aarch64
            rustflags: "-C target-cpu=apple-m1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
            RUSTFLAGS: ${{ matrix.platform.rustflags }}
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}-${{ matrix.python-version }}
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [tests, linux, musllinux, windows, macos]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
